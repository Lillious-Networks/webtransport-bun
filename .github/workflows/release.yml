# Release: build native prebuilds for all supported targets and attach them
# (plus SHA256SUMS) to a GitHub Release. The `publish` workflow then downloads
# those assets and publishes the package to GitHub Packages.
name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            rust_target: ""
          - os: macos-latest
            target: darwin-arm64
            rust_target: ""
          - os: macos-latest
            target: darwin-x64
            rust_target: x86_64-apple-darwin
          - os: windows-latest
            target: win32-x64-msvc
            rust_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - name: Build native addon (${{ matrix.target }})
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            rustup target add ${{ matrix.rust_target }}
            bunx @napi-rs/cli build --cwd crates/native --platform --release --target ${{ matrix.rust_target }}
          else
            bun run build:native
          fi
      - name: Prebuild + checksums
        run: |
          cd packages/webtransport && bun run prebuild:native
          cd ../..
          bun scripts/write-sha256sums.ts packages/webtransport/prebuilds
      - name: Upload prebuilds
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.target }}
          path: packages/webtransport/prebuilds/*

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuilds-*
          path: prebuilds
          merge-multiple: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - name: Regenerate combined SHA256SUMS (all targets)
        run: bun scripts/write-sha256sums.ts prebuilds
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            prebuilds/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
